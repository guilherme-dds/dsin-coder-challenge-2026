services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: file:/data/fogo.db
      PORT: 3333
      SEED_ON_START: ${SEED_ON_START:-false}
      # Demonstração: ao subir, completa o período em que o sistema esteve desligado
      BACKFILL_ON_START: ${BACKFILL_ON_START:-true}
    volumes:
      - db-data:/data
    ports:
      - "${API_PORT:-3333}:3333"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      API_URL: http://server:3333
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  simulator:
    build:
      context: .
      dockerfile: server/Dockerfile
    entrypoint: ["npx", "tsx", "scripts/simulate.ts"]
    command: []
    environment:
      API_URL: http://server:3333
    healthcheck:
      disable: true
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
